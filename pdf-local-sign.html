<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="1.2.20260803">
  <title>Quick Performance Completion Sign | 完成履約通知書快速簽名</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --primary: #1769aa;
      --primary-dark: #0d4d80;
      --accent: #00897b;
      --danger: #b42318;
      --warning: #a15c00;
      --border: #d4dbe3;
      --surface: #ffffff;
      --muted: #5b6573;
      --page: #eef2f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: #1f2933;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.55;
    }

    button, input { font: inherit; }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 18px;
      padding: 22px 24px;
      border-radius: 16px;
      color: white;
      background: linear-gradient(135deg, #0d4d80, #1769aa 55%, #00897b);
      box-shadow: 0 8px 28px rgba(26, 54, 82, .18);
    }

    h1 { margin: 0 0 6px; font-size: clamp(1.45rem, 3vw, 2rem); }
    header p { margin: 0; opacity: .92; }

    .privacy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      font-size: .9rem;
      background: rgba(255,255,255,.11);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .controls { display: grid; gap: 14px; }

    .card {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(27, 46, 66, .07);
    }

    .card h2 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 13px;
      font-size: 1.08rem;
    }

    .step {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      color: white;
      background: var(--primary);
      font-size: .85rem;
    }

    .file-label {
      display: block;
      padding: 14px;
      border: 2px dashed #9eb4c8;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      background: #f7fbff;
      transition: .18s ease;
    }

    .file-label:hover { border-color: var(--primary); background: #eef7ff; }
    input[type="file"] { width: 100%; margin-top: 9px; }

    .hint, .meta { color: var(--muted); font-size: .88rem; }
    .meta { margin-top: 9px; word-break: break-word; }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f7f9fb;
      cursor: pointer;
    }
    .tab.active { border-color: var(--primary); color: var(--primary); background: #edf6ff; font-weight: 700; }
    .signature-mode[hidden] { display: none; }

    #drawCanvas {
      display: block;
      width: 100%;
      height: 150px;
      border: 1px solid #98a6b5;
      border-radius: 8px;
      background: repeating-linear-gradient(0deg, #fff, #fff 36px, #edf1f5 37px);
      touch-action: none;
      cursor: crosshair;
    }

    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    button {
      padding: 9px 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: .16s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(.97); }
    button:disabled { cursor: not-allowed; opacity: .46; }
    .primary { color: white; background: var(--primary); }
    .success { color: white; background: var(--accent); }
    .secondary { border-color: var(--border); color: #334155; background: #fff; }
    .danger { border-color: #efb5b0; color: var(--danger); background: #fff5f4; }

    .saved-signature {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fafcfd;
    }

    .saved-signature[hidden] { display: none; }

    #signatureThumb {
      max-width: 100%;
      max-height: 72px;
      object-fit: contain;
    }

    .range-row {
      display: grid;
      grid-template-columns: auto minmax(100px, 1fr) 48px;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .actions button { min-height: 46px; font-weight: 700; }

    .status {
      margin-top: 11px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: .91rem;
      background: #eef3f7;
    }
    .status.success { color: #075e54; background: #e8f7f3; }
    .status.warning { color: var(--warning); background: #fff4df; }
    .status.error { color: var(--danger); background: #fff0ef; }

    .confirm-row {
      display: none;
      margin-top: 10px;
      padding: 9px;
      border: 1px solid #edc477;
      border-radius: 8px;
      background: #fff9ed;
    }
    .confirm-row.show { display: block; }

    .preview-card { min-width: 0; }
    .preview-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }
    .preview-head h2 { margin: 0; }

    .preview-shell {
      min-height: 480px;
      padding: 14px;
      overflow: auto;
      border: 1px solid #c9d1d9;
      border-radius: 10px;
      background: #7b8794;
    }

    #stage {
      position: relative;
      display: none;
      margin: 0 auto;
      max-width: 100%;
      box-shadow: 0 5px 18px rgba(0,0,0,.25);
      background: white;
      user-select: none;
    }

    #pdfCanvas { display: block; width: 100%; height: auto; }

    .overlay {
      position: absolute;
      z-index: 3;
      cursor: move;
      touch-action: none;
      border: 1px dashed rgba(0, 105, 170, .8);
      background: rgba(0, 105, 170, .05);
    }

    #signatureOverlay { object-fit: contain; pointer-events: auto; }
    #checkOverlay { display: grid; place-items: center; color: #111; font-weight: 900; line-height: 1; }
    #checkOverlay::before { content: "✓"; transform: translateY(-5%); }

    .empty-preview {
      display: grid;
      place-items: center;
      min-height: 450px;
      color: #eef3f7;
      text-align: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .preview-card { order: -1; }
      .preview-shell { min-height: 320px; }
      .empty-preview { min-height: 290px; }
    }

    @media (max-width: 560px) {
      .app { padding: 10px; }
      header, .card { padding: 14px; border-radius: 11px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>完成履約通知書快速簽名</h1>
      <p>為完成履約通知書加入「已完成」勾選與簽名，預覽確認後下載新 PDF。</p>
      <div class="privacy">🔒 PDF 與簽名只在此瀏覽器處理，不會上傳</div>
    </header>

    <div class="layout">
      <section class="controls" aria-label="操作區">
        <div class="card">
          <h2><span class="step">1</span>選擇來源 PDF</h2>
          <label class="file-label" for="pdfInput">
            選擇或拖放 PDF
            <input id="pdfInput" type="file" accept="application/pdf,.pdf">
          </label>
          <div id="pdfMeta" class="meta">尚未選擇檔案</div>
        </div>

        <div class="card">
          <h2><span class="step">2</span>建立或匯入簽名</h2>
          <div class="tabs" role="tablist">
            <button class="tab active" id="drawTab" type="button">手寫簽名</button>
            <button class="tab" id="importTab" type="button">匯入圖片</button>
          </div>

          <div id="drawMode" class="signature-mode">
            <canvas id="drawCanvas" width="1000" height="300" aria-label="手寫簽名區"></canvas>
            <div class="button-row">
              <button id="clearDrawBtn" class="secondary" type="button">清除畫布</button>
              <button id="saveDrawBtn" class="primary" type="button">保存手寫簽名</button>
            </div>
          </div>

          <div id="importMode" class="signature-mode" hidden>
            <label class="file-label" for="signatureInput">
              選擇簽名圖片（PNG、JPG、WebP）
              <input id="signatureInput" type="file" accept="image/png,image/jpeg,image/webp">
            </label>
            <p class="hint">匯入後會自動裁切空白邊框，並將接近白色的背景轉為透明。</p>
          </div>

          <div id="savedSignature" class="saved-signature" hidden>
            <div>
              <div class="hint">目前保存於此瀏覽器的簽名</div>
              <img id="signatureThumb" alt="已保存的簽名">
            </div>
            <button id="deleteSignatureBtn" class="danger" type="button">刪除</button>
          </div>

          <div class="range-row">
            <label for="signatureScale">簽名大小</label>
            <input id="signatureScale" type="range" min="60" max="180" value="100" step="5">
            <output id="signatureScaleValue">100%</output>
          </div>
        </div>

        <div class="card">
          <h2><span class="step">3</span>套用及下載</h2>
          <p class="hint">藍色虛線框可以拖曳微調。工具會優先以「□是」及「簽認人」文字自動定位。</p>
          <div class="button-row">
            <button id="resetPositionBtn" class="secondary" type="button" disabled>重新自動定位</button>
          </div>
          <div id="confirmRow" class="confirm-row">
            <label><input id="confirmPosition" type="checkbox"> 我已在預覽中確認打勾與簽名位置</label>
          </div>
          <div class="actions">
            <button id="applyBtn" class="primary" type="button" disabled>套用 PDF</button>
            <button id="downloadBtn" class="success" type="button" disabled>下載新 PDF</button>
          </div>
          <div id="status" class="status" role="status">請先選擇 PDF 並建立或匯入簽名。</div>
        </div>
      </section>

      <section class="card preview-card" aria-label="PDF 預覽">
        <div class="preview-head">
          <h2>位置預覽</h2>
          <span id="pageLabel" class="hint"></span>
        </div>
        <div class="preview-shell">
          <div id="emptyPreview" class="empty-preview">選擇 PDF 後，第一頁會顯示於此。</div>
          <div id="stage">
            <canvas id="pdfCanvas"></canvas>
            <div id="checkOverlay" class="overlay" aria-label="完成勾選位置"></div>
            <img id="signatureOverlay" class="overlay" alt="簽名位置預覽">
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.worker.min.mjs";

    const { PDFDocument, rgb } = window.PDFLib;
    const STORAGE_KEY = "pdfLocalSign.signature.v1";
    const A4 = { width: 595.32, height: 841.92 };
    const FALLBACK = {
      check: {
        left: 77.415605 / A4.width,
        top: (A4.height - 177.625318) / A4.height,
        width: 9.901412 / A4.width,
        height: 9.901412 / A4.height
      },
      signatureBox: {
        left: 425.185706 / A4.width,
        top: (A4.height - 171.024377) / A4.height,
        width: 61.698677 / A4.width,
        height: 22.203165 / A4.height
      }
    };

    const elements = Object.fromEntries([
      "pdfInput", "pdfMeta", "drawTab", "importTab", "drawMode", "importMode",
      "drawCanvas", "clearDrawBtn", "saveDrawBtn", "signatureInput", "savedSignature",
      "signatureThumb", "deleteSignatureBtn", "signatureScale", "signatureScaleValue",
      "resetPositionBtn", "confirmRow", "confirmPosition", "applyBtn", "downloadBtn",
      "status", "emptyPreview", "stage", "pdfCanvas", "checkOverlay", "signatureOverlay",
      "pageLabel"
    ].map(id => [id, document.getElementById(id)]));

    const state = {
      sourceFile: null,
      sourceBytes: null,
      pdfJsDocument: null,
      pdfPage: null,
      viewport: null,
      signatureDataUrl: null,
      signatureAspect: 2.8,
      check: structuredClone(FALLBACK.check),
      signatureBox: structuredClone(FALLBACK.signatureBox),
      signature: structuredClone(FALLBACK.signatureBox),
      autoLocated: false,
      needsPositionConfirm: true,
      outputBytes: null,
      outputUrl: null,
      outputName: null,
      showingOutputPreview: false,
      previewBusy: false
    };

    function setStatus(message, type = "") {
      elements.status.textContent = message;
      elements.status.className = `status ${type}`.trim();
    }

    function switchMode(mode) {
      const draw = mode === "draw";
      elements.drawTab.classList.toggle("active", draw);
      elements.importTab.classList.toggle("active", !draw);
      elements.drawMode.hidden = !draw;
      elements.importMode.hidden = draw;
    }

    function setupDrawingCanvas() {
      const canvas = elements.drawCanvas;
      const ctx = canvas.getContext("2d");
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 5;
      let drawing = false;
      let hasInk = false;

      const point = event => {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * canvas.width / rect.width,
          y: (event.clientY - rect.top) * canvas.height / rect.height
        };
      };

      canvas.addEventListener("pointerdown", event => {
        drawing = true;
        hasInk = true;
        canvas.setPointerCapture(event.pointerId);
        const p = point(event);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      });

      canvas.addEventListener("pointermove", event => {
        if (!drawing) return;
        const p = point(event);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      });

      const stop = () => { drawing = false; };
      canvas.addEventListener("pointerup", stop);
      canvas.addEventListener("pointercancel", stop);

      elements.clearDrawBtn.addEventListener("click", () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasInk = false;
      });

      elements.saveDrawBtn.addEventListener("click", () => {
        if (!hasInk) {
          setStatus("手寫區尚未有簽名。", "warning");
          return;
        }
        try {
          const cropped = cropCanvas(canvas, false);
          saveSignature(cropped.toDataURL("image/png"), cropped.width / cropped.height);
          setStatus("手寫簽名已裁切並保存於此瀏覽器。", "success");
        } catch (error) {
          setStatus(error.message, "error");
        }
      });
    }

    function cropCanvas(source, removeWhite) {
      const ctx = source.getContext("2d", { willReadFrequently: true });
      const { width, height } = source;
      const image = ctx.getImageData(0, 0, width, height);
      const data = image.data;
      let minX = width, minY = height, maxX = -1, maxY = -1;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const alpha = data[i + 3];
          if (alpha < 8) continue;
          const distanceFromWhite = 255 - Math.min(data[i], data[i + 1], data[i + 2]);
          if (removeWhite) {
            const opacity = Math.max(0, Math.min(1, (distanceFromWhite - 7) / 42));
            data[i + 3] = Math.round(alpha * opacity);
          }
          if (data[i + 3] > 12) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
      }

      if (maxX < minX || maxY < minY) throw new Error("找不到可辨識的簽名筆跡。請重新手寫或選擇其他圖片。");
      ctx.putImageData(image, 0, 0);

      const pad = Math.max(4, Math.round(Math.max(maxX - minX, maxY - minY) * 0.025));
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(width - 1, maxX + pad);
      maxY = Math.min(height - 1, maxY + pad);
      const cropWidth = maxX - minX + 1;
      const cropHeight = maxY - minY + 1;
      const scale = Math.min(1, 1400 / cropWidth, 500 / cropHeight);
      const output = document.createElement("canvas");
      output.width = Math.max(1, Math.round(cropWidth * scale));
      output.height = Math.max(1, Math.round(cropHeight * scale));
      output.getContext("2d").drawImage(
        source, minX, minY, cropWidth, cropHeight,
        0, 0, output.width, output.height
      );
      return output;
    }

    async function importSignature(file) {
      if (!file || !file.type.startsWith("image/")) throw new Error("請選擇 PNG、JPG 或 WebP 圖片。");
      const url = URL.createObjectURL(file);
      try {
        const image = new Image();
        image.src = url;
        await image.decode();
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        canvas.getContext("2d").drawImage(image, 0, 0);
        const cropped = cropCanvas(canvas, true);
        saveSignature(cropped.toDataURL("image/png"), cropped.width / cropped.height);
        setStatus("簽名圖片已自動裁切、移除白色背景並保存。", "success");
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function saveSignature(dataUrl, aspect) {
      const record = { dataUrl, aspect, savedAt: new Date().toISOString() };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
      } catch (error) {
        throw new Error("無法寫入 localStorage，可能是瀏覽器隱私模式或儲存空間不足。");
      }
      state.signatureDataUrl = dataUrl;
      state.signatureAspect = aspect;
      refreshSignatureUi();
      fitSignatureInsideBox();
      updateOverlays();
      invalidateOutput();
      updateButtons();
    }

    function loadStoredSignature() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const record = JSON.parse(raw);
        if (!record.dataUrl?.startsWith("data:image/png;base64,")) return;
        state.signatureDataUrl = record.dataUrl;
        state.signatureAspect = Number(record.aspect) || 2.8;
      } catch (error) {
        console.warn("讀取簽名失敗", error);
      }
      refreshSignatureUi();
    }

    function deleteStoredSignature() {
      localStorage.removeItem(STORAGE_KEY);
      state.signatureDataUrl = null;
      elements.signatureInput.value = "";
      refreshSignatureUi();
      updateOverlays();
      invalidateOutput();
      updateButtons();
      setStatus("已刪除瀏覽器內保存的簽名。", "success");
    }

    function refreshSignatureUi() {
      const exists = Boolean(state.signatureDataUrl);
      elements.savedSignature.hidden = !exists;
      elements.signatureThumb.src = exists ? state.signatureDataUrl : "";
      elements.signatureOverlay.src = exists ? state.signatureDataUrl : "";
      elements.signatureOverlay.style.display = exists && state.sourceBytes && !state.showingOutputPreview ? "block" : "none";
    }

    function dataUrlToBytes(dataUrl) {
      const match = /^data:image\/png;base64,([A-Za-z0-9+/=]+)$/.exec(dataUrl || "");
      if (!match) throw new Error("目前簽名不是有效的 PNG 資料，請重新建立或匯入簽名。");
      const binary = atob(match[1]);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    async function renderPageToMainCanvas(page, viewport) {
      const canvas = elements.pdfCanvas;
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      elements.stage.style.width = `${canvas.width}px`;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    }

    async function showOutputPreview() {
      state.previewBusy = true;
      updateButtons();
      try {
        const outputDocument = await pdfjsLib.getDocument({
          data: new Uint8Array(state.outputBytes.slice(0))
        }).promise;
        const outputPage = await outputDocument.getPage(1);
        const outputViewport = outputPage.getViewport({ scale: state.viewport.scale });
        await renderPageToMainCanvas(outputPage, outputViewport);
        state.showingOutputPreview = true;
        updateOverlays();
        elements.pageLabel.textContent = `實際輸出預覽｜第 1 頁／共 ${outputDocument.numPages} 頁`;
      } finally {
        state.previewBusy = false;
        updateButtons();
      }
    }

    function restoreSourcePreview() {
      if (!state.showingOutputPreview || !state.pdfPage || !state.viewport) return;
      state.previewBusy = true;
      state.showingOutputPreview = false;
      updateButtons();
      renderPageToMainCanvas(state.pdfPage, state.viewport)
        .then(() => {
          updateOverlays();
          elements.pageLabel.textContent = `第 1 頁／共 ${state.pdfJsDocument.numPages} 頁`;
        })
        .catch(error => {
          console.error(error);
          setStatus(`無法恢復來源預覽：${error.message}`, "error");
        })
        .finally(() => {
          state.previewBusy = false;
          updateButtons();
        });
    }

    async function loadPdf(file) {
      if (!file || (!file.name.toLowerCase().endsWith(".pdf") && file.type !== "application/pdf")) {
        throw new Error("請選擇 PDF 檔案。");
      }
      invalidateOutput();
      state.sourceFile = file;
      state.sourceBytes = await file.arrayBuffer();
      const task = pdfjsLib.getDocument({ data: new Uint8Array(state.sourceBytes.slice(0)) });
      state.pdfJsDocument = await task.promise;
      state.pdfPage = await state.pdfJsDocument.getPage(1);
      if (state.pdfPage.rotate !== 0) throw new Error("目前僅支援未旋轉的 PDF 頁面，請先將頁面轉正後再處理。");

      const baseViewport = state.pdfPage.getViewport({ scale: 1 });
      const previewWidth = Math.min(980, Math.max(680, window.innerWidth - 520));
      const scale = Math.max(1, Math.min(2, previewWidth / baseViewport.width));
      state.viewport = state.pdfPage.getViewport({ scale });
      await renderPageToMainCanvas(state.pdfPage, state.viewport);

      elements.emptyPreview.style.display = "none";
      elements.stage.style.display = "block";
      elements.pageLabel.textContent = `第 1 頁／共 ${state.pdfJsDocument.numPages} 頁`;
      elements.pdfMeta.textContent = `${file.name}｜${formatBytes(file.size)}｜${state.pdfJsDocument.numPages} 頁`;
      refreshSignatureUi();
      await autoLocate();
      elements.resetPositionBtn.disabled = false;
      updateButtons();
    }

    function findTextItem(items, fragments) {
      const normalize = text => text.replace(/\s+/g, "");
      return items.find(item => fragments.some(fragment => normalize(item.str).includes(normalize(fragment))));
    }

    function itemBox(item) {
      const transform = pdfjsLib.Util.transform(state.viewport.transform, item.transform);
      const height = Math.max(1, Math.hypot(transform[2], transform[3]));
      return { left: transform[4], top: transform[5] - height, height };
    }

    async function autoLocate() {
      if (!state.pdfPage || !state.viewport) return;
      const text = await state.pdfPage.getTextContent();
      const yesItem = findTextItem(text.items, ["□是"]);
      const phraseItem = findTextItem(text.items, ["完成履約日期無誤"]);
      const signerItem = findTextItem(text.items, ["簽認人"]);
      const scale = state.viewport.scale;
      let yesBox = yesItem ? itemBox(yesItem) : (phraseItem ? itemBox(phraseItem) : null);

      if (yesBox && !yesItem) yesBox.left -= 42.356 * scale;
      const allAnchors = Boolean(yesBox && signerItem);

      if (allAnchors) {
        const signerBox = itemBox(signerItem);
        state.check = {
          left: (yesBox.left + 3 * scale) / state.viewport.width,
          top: (yesBox.top + 2.7 * scale) / state.viewport.height,
          width: 9.901412 * scale / state.viewport.width,
          height: 9.901412 * scale / state.viewport.height
        };
        state.signatureBox = {
          left: (signerBox.left - 20.474294 * scale) / state.viewport.width,
          top: (yesBox.top + 9.303906 * scale) / state.viewport.height,
          width: 61.698677 * scale / state.viewport.width,
          height: 22.203165 * scale / state.viewport.height
        };
        state.autoLocated = true;
        state.needsPositionConfirm = state.pdfJsDocument.numPages !== 1;
        setStatus(
          state.needsPositionConfirm
            ? "已自動定位第一頁，但來源超過一頁；請確認只需簽署第一頁。"
            : "已依文字錨點自動定位，請在預覽中確認位置。",
          state.needsPositionConfirm ? "warning" : "success"
        );
      } else {
        state.check = structuredClone(FALLBACK.check);
        state.signatureBox = structuredClone(FALLBACK.signatureBox);
        state.autoLocated = false;
        state.needsPositionConfirm = true;
        setStatus("找不到完整文字錨點，已使用樣本比例定位。請拖曳調整並勾選位置確認。", "warning");
      }

      elements.confirmPosition.checked = false;
      elements.confirmRow.classList.toggle("show", state.needsPositionConfirm);
      fitSignatureInsideBox();
      updateOverlays();
      invalidateOutput();
      updateButtons();
    }

    function fitSignatureInsideBox() {
      const box = state.signatureBox;
      const pageAspect = state.viewport ? state.viewport.width / state.viewport.height : A4.width / A4.height;
      const boxPixelAspect = (box.width / box.height) * pageAspect;
      let width = box.width;
      let height = box.height;
      if (state.signatureAspect > boxPixelAspect) {
        height = width * pageAspect / state.signatureAspect;
      } else {
        width = height * state.signatureAspect / pageAspect;
      }
      const scale = Number(elements.signatureScale.value) / 100;
      width *= scale;
      height *= scale;
      state.signature = {
        left: box.left + (box.width - width) / 2,
        top: box.top + (box.height - height) / 2,
        width,
        height
      };
    }

    function updateOverlays() {
      const setBox = (element, box) => {
        element.style.left = `${box.left * 100}%`;
        element.style.top = `${box.top * 100}%`;
        element.style.width = `${box.width * 100}%`;
        element.style.height = `${box.height * 100}%`;
      };
      setBox(elements.checkOverlay, state.check);
      setBox(elements.signatureOverlay, state.signature);
      elements.checkOverlay.style.display = state.sourceBytes && !state.showingOutputPreview ? "grid" : "none";
      elements.signatureOverlay.style.display = state.signatureDataUrl && state.sourceBytes && !state.showingOutputPreview ? "block" : "none";
      const checkPixels = state.viewport ? state.check.height * state.viewport.height : 14;
      elements.checkOverlay.style.fontSize = `${Math.max(10, checkPixels * 1.35)}px`;
    }

    function makeDraggable(element, stateKey) {
      let start = null;
      element.addEventListener("pointerdown", event => {
        if (!state.sourceBytes) return;
        event.preventDefault();
        element.setPointerCapture(event.pointerId);
        const rect = elements.stage.getBoundingClientRect();
        start = {
          x: event.clientX,
          y: event.clientY,
          left: state[stateKey].left,
          top: state[stateKey].top,
          stageWidth: rect.width,
          stageHeight: rect.height
        };
      });
      element.addEventListener("pointermove", event => {
        if (!start) return;
        const box = state[stateKey];
        box.left = Math.max(0, Math.min(1 - box.width, start.left + (event.clientX - start.x) / start.stageWidth));
        box.top = Math.max(0, Math.min(1 - box.height, start.top + (event.clientY - start.y) / start.stageHeight));
        updateOverlays();
        invalidateOutput();
      });
      const stop = () => { start = null; };
      element.addEventListener("pointerup", stop);
      element.addEventListener("pointercancel", stop);
    }

    async function applyPdf() {
      if (!state.sourceBytes || !state.signatureDataUrl) return;
      if (state.needsPositionConfirm && !elements.confirmPosition.checked) {
        setStatus("請先確認預覽位置並勾選位置確認。", "warning");
        return;
      }
      elements.applyBtn.disabled = true;
      setStatus("正在把打勾與簽名寫入 PDF…");
      try {
        const previewSignatureDataUrl = elements.signatureOverlay.getAttribute("src");
        if (!previewSignatureDataUrl || previewSignatureDataUrl !== state.signatureDataUrl) {
          throw new Error("畫面簽名與保存資料不一致，請重新建立或匯入簽名。");
        }
        const signatureBytes = dataUrlToBytes(previewSignatureDataUrl);
        const document = await PDFDocument.load(state.sourceBytes.slice(0));
        const page = document.getPages()[0];
        const { width, height } = page.getSize();
        const check = state.check;
        const checkX = check.left * width;
        const checkY = height - (check.top + check.height) * height;
        const checkWidth = check.width * width;
        const checkHeight = check.height * height;
        const ink = rgb(0.04, 0.05, 0.07);
        const thickness = Math.max(1.2, Math.min(checkWidth, checkHeight) * 0.16);

        page.drawLine({
          start: { x: checkX + checkWidth * 0.08, y: checkY + checkHeight * 0.48 },
          end: { x: checkX + checkWidth * 0.36, y: checkY + checkHeight * 0.17 },
          thickness,
          color: ink
        });
        page.drawLine({
          start: { x: checkX + checkWidth * 0.36, y: checkY + checkHeight * 0.17 },
          end: { x: checkX + checkWidth * 0.94, y: checkY + checkHeight * 0.88 },
          thickness,
          color: ink
        });

        const signature = await document.embedPng(signatureBytes);
        page.drawImage(signature, {
          x: state.signature.left * width,
          y: height - (state.signature.top + state.signature.height) * height,
          width: state.signature.width * width,
          height: state.signature.height * height
        });

        state.outputBytes = await document.save();
        state.outputName = makeOutputName(state.sourceFile.name);
        await showOutputPreview();
        state.outputUrl = URL.createObjectURL(new Blob([state.outputBytes], { type: "application/pdf" }));
        elements.downloadBtn.disabled = false;
        setStatus(`已完成並顯示實際輸出：${state.outputName}。確認畫面後請按「下載新 PDF」。`, "success");
      } catch (error) {
        console.error(error);
        setStatus(`套用失敗：${error.message}`, "error");
      } finally {
        updateButtons();
      }
    }

    function downloadPdf() {
      if (!state.outputUrl) return;
      const link = document.createElement("a");
      link.href = state.outputUrl;
      link.download = state.outputName;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function makeOutputName(sourceName) {
      const stem = sourceName.replace(/\.pdf$/i, "");
      const now = new Date();
      const pad = number => String(number).padStart(2, "0");
      const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
      return `${stem}-${stamp}.pdf`;
    }

    function invalidateOutput() {
      restoreSourcePreview();
      if (state.outputUrl) URL.revokeObjectURL(state.outputUrl);
      state.outputBytes = null;
      state.outputUrl = null;
      state.outputName = null;
      elements.downloadBtn.disabled = true;
    }

    function updateButtons() {
      const ready = Boolean(state.sourceBytes && state.signatureDataUrl);
      const confirmed = !state.needsPositionConfirm || elements.confirmPosition.checked;
      elements.applyBtn.disabled = !(ready && confirmed) || state.previewBusy;
      elements.downloadBtn.disabled = !state.outputUrl;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 ** 2).toFixed(2)} MB`;
    }

    elements.drawTab.addEventListener("click", () => switchMode("draw"));
    elements.importTab.addEventListener("click", () => switchMode("import"));
    elements.signatureInput.addEventListener("change", event => {
      importSignature(event.target.files[0]).catch(error => setStatus(error.message, "error"));
    });
    elements.deleteSignatureBtn.addEventListener("click", deleteStoredSignature);
    elements.pdfInput.addEventListener("change", event => {
      loadPdf(event.target.files[0]).catch(error => {
        console.error(error);
        setStatus(`讀取 PDF 失敗：${error.message}`, "error");
      });
    });
    elements.signatureScale.addEventListener("input", () => {
      elements.signatureScaleValue.textContent = `${elements.signatureScale.value}%`;
      fitSignatureInsideBox();
      updateOverlays();
      invalidateOutput();
    });
    elements.resetPositionBtn.addEventListener("click", autoLocate);
    elements.confirmPosition.addEventListener("change", updateButtons);
    elements.applyBtn.addEventListener("click", applyPdf);
    elements.downloadBtn.addEventListener("click", downloadPdf);

    makeDraggable(elements.checkOverlay, "check");
    makeDraggable(elements.signatureOverlay, "signature");
    setupDrawingCanvas();
    loadStoredSignature();
    updateButtons();
  </script>
</body>
</html>
