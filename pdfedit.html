<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="1.0.20260804">
  <title>PDF Editor | PDF 頁面編輯器</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --primary: #1769aa;
      --primary-dark: #0d4d80;
      --accent: #00897b;
      --danger: #b42318;
      --warning: #a15c00;
      --border: #d4dbe3;
      --surface: #ffffff;
      --muted: #5b6573;
      --page: #eef2f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: #1f2933;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.55;
    }

    button, input { font: inherit; }

    .app {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 18px;
      padding: 22px 24px;
      border-radius: 16px;
      color: white;
      background: linear-gradient(135deg, #0d4d80, #1769aa 55%, #00897b);
      box-shadow: 0 8px 28px rgba(26, 54, 82, .18);
    }

    h1 { margin: 0 0 6px; font-size: clamp(1.45rem, 3vw, 2rem); }
    header p { margin: 0; opacity: .92; }

    .privacy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      font-size: .9rem;
      background: rgba(255,255,255,.11);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .controls { display: grid; gap: 14px; }

    .card {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(27, 46, 66, .07);
    }

    .card h2 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 13px;
      font-size: 1.08rem;
    }

    .step {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      color: white;
      background: var(--primary);
      font-size: .85rem;
    }

    .file-label {
      display: block;
      padding: 24px 14px;
      border: 2px dashed #9eb4c8;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      background: #f7fbff;
      transition: .18s ease;
    }

    .file-label:hover { border-color: var(--primary); background: #eef7ff; }
    .file-label.dragover { border-color: var(--accent); background: #e8f7f3; }
    input[type="file"] { display: none; }

    .hint { color: var(--muted); font-size: .88rem; margin-top: 8px; }

    .file-list { margin-top: 12px; }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafcfd;
      font-size: .9rem;
    }
    .file-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-item .pages { color: var(--muted); margin: 0 8px; font-size: .85rem; }

    button {
      padding: 9px 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: .16s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(.97); }
    button:disabled { cursor: not-allowed; opacity: .46; }
    .primary { color: white; background: var(--primary); }
    .success { color: white; background: var(--accent); }
    .secondary { border-color: var(--border); color: #334155; background: #fff; }
    .danger { border-color: #efb5b0; color: var(--danger); background: #fff5f4; }
    .small-btn { padding: 4px 8px; font-size: .8rem; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
    .actions button { min-height: 46px; font-weight: 700; }

    .status {
      margin-top: 11px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: .91rem;
      background: #eef3f7;
    }
    .status.success { color: #075e54; background: #e8f7f3; }
    .status.warning { color: var(--warning); background: #fff4df; }
    .status.error { color: var(--danger); background: #fff0ef; }

    .preview-card { min-width: 0; }
    .preview-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .preview-head h2 { margin: 0; }

    .toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      min-height: 400px;
      padding: 14px;
      border: 1px solid #c9d1d9;
      border-radius: 10px;
      background: #7b8794;
    }

    .page-item {
      position: relative;
      background: white;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0,0,0,.2);
      cursor: grab;
      transition: transform .15s, box-shadow .15s;
      user-select: none;
    }

    .page-item:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.25); }
    .page-item.dragging { opacity: .5; cursor: grabbing; }
    .page-item.selected { outline: 3px solid var(--primary); outline-offset: 2px; }
    .page-item.drag-over { outline: 3px dashed var(--accent); outline-offset: 2px; }

    .page-thumb {
      display: block;
      width: 100%;
      aspect-ratio: 210 / 297;
      object-fit: contain;
      border-radius: 6px 6px 0 0;
      background: #f0f0f0;
    }

    .page-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: .8rem;
      background: #f8f9fa;
      border-radius: 0 0 6px 6px;
    }

    .page-num { font-weight: 600; color: var(--primary-dark); }

    .page-actions {
      display: flex;
      gap: 4px;
    }

    .page-actions button {
      padding: 3px 6px;
      font-size: .75rem;
      border-radius: 4px;
    }

    .rotate-indicator {
      position: absolute;
      top: 4px;
      right: 4px;
      padding: 2px 5px;
      font-size: .7rem;
      background: rgba(0,0,0,.6);
      color: white;
      border-radius: 3px;
    }

    .source-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      padding: 2px 5px;
      font-size: .65rem;
      background: var(--primary);
      color: white;
      border-radius: 3px;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      grid-column: 1 / -1;
      display: grid;
      place-items: center;
      min-height: 350px;
      color: #dce3e8;
      text-align: center;
      font-size: 1.1rem;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: .9rem;
      color: var(--muted);
    }

    .stats span { display: flex; align-items: center; gap: 4px; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .preview-card { order: -1; }
      .page-grid { min-height: 300px; }
    }

    @media (max-width: 560px) {
      .app { padding: 10px; }
      header, .card { padding: 14px; border-radius: 11px; }
      .actions { grid-template-columns: 1fr; }
      .page-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>PDF 頁面編輯器</h1>
      <p>合併多個 PDF、重新排序頁面、旋轉或刪除不需要的頁面，完成後下載新 PDF。</p>
      <div class="privacy">🔒 所有處理皆在瀏覽器進行，檔案不會上傳</div>
    </header>

    <div class="layout">
      <section class="controls" aria-label="操作區">
        <div class="card">
          <h2><span class="step">1</span>選擇 PDF 檔案</h2>
          <label class="file-label" id="dropZone" for="pdfInput">
            <div>📄 點擊選擇或拖放 PDF</div>
            <div style="font-size: .85rem; margin-top: 6px; color: var(--muted);">支援多選，可一次加入多個檔案</div>
          </label>
          <input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple>
          <div id="fileList" class="file-list"></div>
        </div>

        <div class="card">
          <h2><span class="step">2</span>編輯頁面</h2>
          <p class="hint">
            • 拖曳縮圖調整順序<br>
            • 點擊選取，Shift+點擊多選<br>
            • 使用工具列批次操作
          </p>
          <div class="stats" id="stats"></div>
        </div>

        <div class="card">
          <h2><span class="step">3</span>下載結果</h2>
          <div class="actions">
            <button id="mergeBtn" class="primary" type="button" disabled>合併 PDF</button>
            <button id="downloadBtn" class="success" type="button" disabled>下載結果</button>
          </div>
          <div id="status" class="status" role="status">請先選擇 PDF 檔案。</div>
        </div>
      </section>

      <section class="card preview-card" aria-label="頁面預覽">
        <div class="preview-head">
          <h2>頁面預覽</h2>
          <div class="toolbar">
            <button id="selectAllBtn" class="secondary small-btn" type="button" disabled>全選</button>
            <button id="deselectBtn" class="secondary small-btn" type="button" disabled>取消選取</button>
            <button id="rotateLeftBtn" class="secondary small-btn" type="button" disabled>↺ 左轉</button>
            <button id="rotateRightBtn" class="secondary small-btn" type="button" disabled>↻ 右轉</button>
            <button id="deleteSelectedBtn" class="danger small-btn" type="button" disabled>刪除選取</button>
          </div>
        </div>
        <div class="page-grid" id="pageGrid">
          <div class="empty-state">選擇 PDF 後，頁面縮圖會顯示在這裡</div>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

    const { PDFDocument, degrees } = window.PDFLib;

    const elements = Object.fromEntries([
      "pdfInput", "dropZone", "fileList", "pageGrid", "stats",
      "selectAllBtn", "deselectBtn", "rotateLeftBtn", "rotateRightBtn",
      "deleteSelectedBtn", "mergeBtn", "downloadBtn", "status"
    ].map(id => [id, document.getElementById(id)]));

    const state = {
      files: [],
      pages: [],
      selected: new Set(),
      outputBytes: null,
      outputUrl: null,
      draggedIndex: null
    };

    function setStatus(message, type = "") {
      elements.status.textContent = message;
      elements.status.className = `status ${type}`.trim();
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 ** 2).toFixed(2)} MB`;
    }

    function updateStats() {
      const total = state.pages.length;
      const selected = state.selected.size;
      const files = state.files.length;
      elements.stats.innerHTML = total > 0
        ? `<span>📄 ${total} 頁</span><span>📁 ${files} 個檔案</span>${selected > 0 ? `<span>✓ 已選 ${selected} 頁</span>` : ''}`
        : '';
    }

    function updateButtons() {
      const hasPages = state.pages.length > 0;
      const hasSelected = state.selected.size > 0;
      elements.selectAllBtn.disabled = !hasPages;
      elements.deselectBtn.disabled = !hasSelected;
      elements.rotateLeftBtn.disabled = !hasSelected;
      elements.rotateRightBtn.disabled = !hasSelected;
      elements.deleteSelectedBtn.disabled = !hasSelected;
      elements.mergeBtn.disabled = !hasPages;
      elements.downloadBtn.disabled = !state.outputUrl;
    }

    function updateFileList() {
      elements.fileList.innerHTML = state.files.map((f, i) => `
        <div class="file-item">
          <span class="name" title="${f.name}">${f.name}</span>
          <span class="pages">${f.pageCount} 頁</span>
          <button class="danger small-btn" onclick="removeFile(${i})">移除</button>
        </div>
      `).join('');
    }

    window.removeFile = function(index) {
      const file = state.files[index];
      state.pages = state.pages.filter(p => p.sourceFile !== file.name);
      state.files.splice(index, 1);
      state.selected.clear();
      invalidateOutput();
      updateFileList();
      renderPages();
      updateStats();
      updateButtons();
      setStatus(state.pages.length > 0 ? '已移除檔案。' : '請選擇 PDF 檔案。');
    };

    async function loadPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdfJs = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
      const pageCount = pdfJs.numPages;

      const fileInfo = {
        name: file.name,
        size: file.size,
        pageCount,
        bytes: arrayBuffer
      };
      state.files.push(fileInfo);

      for (let i = 1; i <= pageCount; i++) {
        const page = await pdfJs.getPage(i);
        const viewport = page.getViewport({ scale: 0.4 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;

        state.pages.push({
          sourceFile: file.name,
          sourcePageNum: i,
          thumbnail: canvas.toDataURL('image/jpeg', 0.7),
          rotation: 0
        });
      }
    }

    async function handleFiles(files) {
      const pdfFiles = Array.from(files).filter(f =>
        f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')
      );

      if (pdfFiles.length === 0) {
        setStatus('請選擇 PDF 檔案。', 'warning');
        return;
      }

      setStatus(`正在載入 ${pdfFiles.length} 個檔案...`);
      invalidateOutput();

      for (const file of pdfFiles) {
        try {
          await loadPdf(file);
        } catch (error) {
          console.error(error);
          setStatus(`載入 ${file.name} 失敗：${error.message}`, 'error');
        }
      }

      updateFileList();
      renderPages();
      updateStats();
      updateButtons();
      setStatus(`已載入 ${state.pages.length} 頁，可開始編輯。`, 'success');
    }

    function renderPages() {
      if (state.pages.length === 0) {
        elements.pageGrid.innerHTML = '<div class="empty-state">選擇 PDF 後，頁面縮圖會顯示在這裡</div>';
        return;
      }

      elements.pageGrid.innerHTML = state.pages.map((page, index) => `
        <div class="page-item ${state.selected.has(index) ? 'selected' : ''}"
             data-index="${index}"
             draggable="true">
          ${page.rotation !== 0 ? `<span class="rotate-indicator">${page.rotation}°</span>` : ''}
          <span class="source-badge" title="${page.sourceFile}">${page.sourceFile.replace(/\.pdf$/i, '')}</span>
          <img class="page-thumb" src="${page.thumbnail}" alt="第 ${index + 1} 頁"
               style="transform: rotate(${page.rotation}deg)">
          <div class="page-info">
            <span class="page-num">${index + 1}</span>
            <div class="page-actions">
              <button class="secondary" onclick="rotatePage(${index}, -90)" title="左轉">↺</button>
              <button class="secondary" onclick="rotatePage(${index}, 90)" title="右轉">↻</button>
              <button class="danger" onclick="deletePage(${index})" title="刪除">✕</button>
            </div>
          </div>
        </div>
      `).join('');

      setupDragAndDrop();
    }

    function setupDragAndDrop() {
      const items = elements.pageGrid.querySelectorAll('.page-item');

      items.forEach(item => {
        item.addEventListener('dragstart', e => {
          state.draggedIndex = parseInt(item.dataset.index);
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          items.forEach(i => i.classList.remove('drag-over'));
          state.draggedIndex = null;
        });

        item.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          item.classList.add('drag-over');
        });

        item.addEventListener('dragleave', () => {
          item.classList.remove('drag-over');
        });

        item.addEventListener('drop', e => {
          e.preventDefault();
          item.classList.remove('drag-over');
          const targetIndex = parseInt(item.dataset.index);
          if (state.draggedIndex !== null && state.draggedIndex !== targetIndex) {
            const [moved] = state.pages.splice(state.draggedIndex, 1);
            state.pages.splice(targetIndex, 0, moved);
            state.selected.clear();
            invalidateOutput();
            renderPages();
            updateStats();
            updateButtons();
          }
        });

        item.addEventListener('click', e => {
          if (e.target.tagName === 'BUTTON') return;
          const index = parseInt(item.dataset.index);
          if (e.shiftKey && state.selected.size > 0) {
            const lastSelected = Math.max(...state.selected);
            const start = Math.min(lastSelected, index);
            const end = Math.max(lastSelected, index);
            for (let i = start; i <= end; i++) state.selected.add(i);
          } else if (e.ctrlKey || e.metaKey) {
            if (state.selected.has(index)) state.selected.delete(index);
            else state.selected.add(index);
          } else {
            if (state.selected.has(index) && state.selected.size === 1) {
              state.selected.clear();
            } else {
              state.selected.clear();
              state.selected.add(index);
            }
          }
          renderPages();
          updateStats();
          updateButtons();
        });
      });
    }

    window.rotatePage = function(index, angle) {
      state.pages[index].rotation = (state.pages[index].rotation + angle + 360) % 360;
      invalidateOutput();
      renderPages();
    };

    window.deletePage = function(index) {
      state.pages.splice(index, 1);
      state.selected.clear();
      invalidateOutput();
      renderPages();
      updateStats();
      updateButtons();
      setStatus(state.pages.length > 0 ? `已刪除，剩餘 ${state.pages.length} 頁。` : '所有頁面已刪除。');
    };

    function selectAll() {
      state.pages.forEach((_, i) => state.selected.add(i));
      renderPages();
      updateStats();
      updateButtons();
    }

    function deselectAll() {
      state.selected.clear();
      renderPages();
      updateStats();
      updateButtons();
    }

    function rotateSelected(angle) {
      state.selected.forEach(index => {
        state.pages[index].rotation = (state.pages[index].rotation + angle + 360) % 360;
      });
      invalidateOutput();
      renderPages();
    }

    function deleteSelected() {
      const indices = Array.from(state.selected).sort((a, b) => b - a);
      indices.forEach(i => state.pages.splice(i, 1));
      state.selected.clear();
      invalidateOutput();
      renderPages();
      updateStats();
      updateButtons();
      setStatus(state.pages.length > 0 ? `已刪除 ${indices.length} 頁。` : '所有頁面已刪除。');
    }

    async function mergePdf() {
      if (state.pages.length === 0) return;

      setStatus('正在合併 PDF...');
      elements.mergeBtn.disabled = true;

      try {
        const outputDoc = await PDFDocument.create();
        const fileCache = new Map();

        for (const file of state.files) {
          const doc = await PDFDocument.load(file.bytes);
          fileCache.set(file.name, doc);
        }

        for (const page of state.pages) {
          const sourceDoc = fileCache.get(page.sourceFile);
          const [copiedPage] = await outputDoc.copyPages(sourceDoc, [page.sourcePageNum - 1]);

          if (page.rotation !== 0) {
            copiedPage.setRotation(degrees(page.rotation));
          }

          outputDoc.addPage(copiedPage);
        }

        state.outputBytes = await outputDoc.save();
        if (state.outputUrl) URL.revokeObjectURL(state.outputUrl);
        state.outputUrl = URL.createObjectURL(new Blob([state.outputBytes], { type: 'application/pdf' }));

        elements.downloadBtn.disabled = false;
        setStatus(`合併完成！共 ${state.pages.length} 頁，${formatBytes(state.outputBytes.byteLength)}`, 'success');
      } catch (error) {
        console.error(error);
        setStatus(`合併失敗：${error.message}`, 'error');
      } finally {
        elements.mergeBtn.disabled = false;
      }
    }

    function downloadPdf() {
      if (!state.outputUrl) return;
      const link = document.createElement('a');
      link.href = state.outputUrl;
      const timestamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '').slice(0, 14);
      link.download = `merged-${timestamp}.pdf`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function invalidateOutput() {
      if (state.outputUrl) {
        URL.revokeObjectURL(state.outputUrl);
        state.outputUrl = null;
      }
      state.outputBytes = null;
      elements.downloadBtn.disabled = true;
    }

    // Event listeners
    elements.pdfInput.addEventListener('change', e => handleFiles(e.target.files));

    elements.dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      elements.dropZone.classList.add('dragover');
    });

    elements.dropZone.addEventListener('dragleave', () => {
      elements.dropZone.classList.remove('dragover');
    });

    elements.dropZone.addEventListener('drop', e => {
      e.preventDefault();
      elements.dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    elements.selectAllBtn.addEventListener('click', selectAll);
    elements.deselectBtn.addEventListener('click', deselectAll);
    elements.rotateLeftBtn.addEventListener('click', () => rotateSelected(-90));
    elements.rotateRightBtn.addEventListener('click', () => rotateSelected(90));
    elements.deleteSelectedBtn.addEventListener('click', deleteSelected);
    elements.mergeBtn.addEventListener('click', mergePdf);
    elements.downloadBtn.addEventListener('click', downloadPdf);

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'a' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        selectAll();
      } else if (e.key === 'Escape') {
        deselectAll();
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        if (state.selected.size > 0) {
          e.preventDefault();
          deleteSelected();
        }
      }
    });

    updateButtons();
  </script>
</body>
</html>
